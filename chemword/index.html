<title>ChemWord</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Tinos:ital,wght@0,400;0,700;1,400;1,700&family=Arimo:ital,wght@0,400;0,700;1,400;1,700&family=Cousine:wght@400;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caladea:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<style>
/* Layout: word-processor shell. Ribbon on top, A4 pages on a grey desk, status bar below. A full-screen ChemDraw sketcher opens over it when a chem area is clicked. */
:root{
  --desk:#e3e6eb; --chrome:#ffffff; --chrome-2:#f2f4f7; --ink:#1b222c; --muted:#5d6878; --line:#d5dbe3;
  --accent:#1f4fd6; --accent-ink:#ffffff; --accent-soft:#e4ebff; --danger:#b42318;
  --f-ui:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --desk:#0d1117; --chrome:#171d26; --chrome-2:#1e2632; --ink:#e4e9f0; --muted:#98a4b5; --line:#2b3542;
  --accent:#86a6ff; --accent-ink:#0b1222; --accent-soft:#1f2b46; --danger:#ff8a80; color-scheme:dark } }
:root[data-theme="dark"]{
  --desk:#0d1117; --chrome:#171d26; --chrome-2:#1e2632; --ink:#e4e9f0; --muted:#98a4b5; --line:#2b3542;
  --accent:#86a6ff; --accent-ink:#0b1222; --accent-soft:#1f2b46; --danger:#ff8a80; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--f-ui);font-size:13.5px;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.rib{background:var(--chrome);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:4px 4px;padding:6px 8px;scrollbar-width:thin;position:relative;z-index:6}
.grp{display:flex;align-items:center;gap:2px;flex:none}
.sep{width:1px;height:24px;background:var(--line);margin:0 5px;flex:none}
.ib{border:1px solid transparent;background:none;border-radius:6px;height:32px;min-width:32px;padding:0 7px;display:inline-flex;align-items:center;justify-content:center;gap:5px;flex:none;color:var(--ink);font-size:13.5px;white-space:nowrap}
.ib:hover{background:var(--chrome-2);border-color:var(--line)}
.ib[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.ib:disabled{opacity:.4;cursor:default}
.ib.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600;padding:0 11px}
.ib.pri[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent-soft)}
.ib sub,.ib sup{font-size:.68em;line-height:0}
.ib.dd{min-width:20px;padding:0 3px;margin-left:-3px}
.sel{height:32px;border:1px solid var(--line);background:var(--chrome);border-radius:6px;padding:0 6px;flex:none}
.sel.fam{width:150px}.sel.sz{width:62px}.sel.sty{width:112px}
.cbar{display:block;height:3px;width:16px;border-radius:1px;margin-top:-2px}
.cw{display:inline-flex;flex-direction:column;align-items:center;line-height:1}
.colin{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.tgrp{background:var(--accent-soft);border-radius:8px;padding:0 4px}
.tgrp .lbl,.igrp .lbl{font-size:11.5px;color:var(--muted);padding:0 4px;text-transform:uppercase;letter-spacing:.05em}

.scroller{overflow:auto;position:relative;min-height:0;overscroll-behavior:contain}
.stage{position:relative}
.paper{position:absolute;top:24px;width:794px;transform-origin:0 0}
.pbg{position:absolute;left:0;top:0;width:794px;pointer-events:none}
.pg{position:absolute;left:0;width:794px;height:1123px;background:#fff;box-shadow:0 1px 3px rgba(10,20,40,.14),0 8px 22px rgba(10,20,40,.10)}
.pnum{position:absolute;left:0;right:0;bottom:44px;text-align:center;font:10pt Calibri,Carlito,Arial,sans-serif;color:#000}
.area{position:absolute;inset:0;cursor:crosshair;z-index:4;touch-action:none}
.arect{position:absolute;border:1.5px dashed #1f4fd6;background:rgba(31,79,214,.07);pointer-events:none}

/* ---------- the document (always paper colours) ---------- */
.doc{position:relative;padding:96px 96px 0;outline:none;font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif;font-size:11pt;line-height:1.15;color:#000;caret-color:#000;overflow-wrap:break-word;z-index:1}
.doc p{margin:0 0 8pt}
.doc h1{font-size:16pt;font-weight:400;color:#2f5496;margin:12pt 0 4pt;line-height:1.15}
.doc h2{font-size:13pt;font-weight:400;color:#2f5496;margin:10pt 0 4pt;line-height:1.15}
.doc h3{font-size:12pt;font-weight:400;color:#1f3763;margin:8pt 0 4pt;line-height:1.15}
.doc ul,.doc ol{margin:0 0 8pt;padding-left:36px}
.doc li{margin:0}
.doc blockquote{margin:0 0 0 40px}
.doc table{border-collapse:collapse;width:100%;margin:0 0 8pt}
.doc td,.doc th{border:1px solid #000;padding:2px 6px;vertical-align:top;min-width:24px}
.doc img{max-width:100%;height:auto}
.doc img.isel{outline:2px solid #1f4fd6}
.doc hr{border:0;border-top:1px solid #000;margin:6px 0}
.doc hr.pb{border-top:1.5px dashed #9aa6b8;margin:8px 0 12px}
.doc ::selection{background:#c6d6ff}
figure.chem{display:block;position:relative;margin:2px 0 8pt;cursor:pointer;user-select:none;-webkit-user-select:none}
figure.chem svg.csvg{display:block;width:100%;height:100%}
figure.chem:hover{outline:1px solid #1f4fd6;outline-offset:1px}
figure.chem.empty{outline:1.5px dashed #9db0e8;outline-offset:-1px;background:#f5f7fc}
figure.chem .clab{display:none;position:absolute;inset:0;align-items:center;justify-content:center;font:12px var(--f-ui);color:#4a5a78;text-align:center;padding:6px;pointer-events:none}
figure.chem.empty .clab{display:flex}
figure.chem .cui{position:absolute;top:-30px;right:0;display:none;gap:2px;background:#fff;border:1px solid #c9d2e0;border-radius:7px;padding:2px;box-shadow:0 4px 12px rgba(10,20,40,.14);z-index:3}
figure.chem:hover .cui,figure.chem.sel .cui{display:flex}
@media (hover:none){figure.chem .cui{display:flex}}
.cui button{border:0;background:none;border-radius:5px;height:24px;min-width:26px;padding:0 6px;font:12px var(--f-ui);color:#1b222c}
.cui button:hover{background:#eef2f8}
.cui button.dl{color:#b42318}
figure.chem .crs{position:absolute;right:-6px;bottom:-6px;width:13px;height:13px;border:2px solid #1f4fd6;background:#fff;border-radius:3px;cursor:nwse-resize;display:none;touch-action:none;z-index:3}
figure.chem:hover .crs,figure.chem.sel .crs{display:block}
@media (hover:none){figure.chem .crs{display:block}}

/* print clone */
.printing .pg{box-shadow:none}
.printing figure.chem{outline:none!important;background:none!important}
.printing .clab,.printing .cui,.printing .crs{display:none!important}
.printing hr.pb{border-top-color:transparent}
.printing img.isel{outline:none}

.status{background:var(--chrome);border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:4px 10px calc(4px + env(safe-area-inset-bottom,0px));font-size:12.5px;color:var(--muted)}
.status .sp{flex:1}
.status .ib{height:26px;min-width:26px}
.zl{min-width:46px;text-align:center;font-variant-numeric:tabular-nums}

.menu{position:fixed;background:var(--chrome);border:1px solid var(--line);border-radius:10px;padding:6px;min-width:220px;box-shadow:0 12px 30px rgba(10,20,40,.22);display:grid;z-index:40;max-height:80vh;overflow:auto}
.menu button,.menu label{border:0;background:none;text-align:left;padding:8px 10px;border-radius:7px;display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--ink)}
.menu button:hover,.menu label:hover{background:var(--chrome-2)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
.tgrid{display:grid;grid-template-columns:repeat(8,20px);gap:3px;padding:6px}
.tgrid span{width:20px;height:20px;border:1px solid var(--line);border-radius:3px;background:var(--chrome)}
.tgrid span.on{background:var(--accent-soft);border-color:var(--accent)}
.tglab{text-align:center;font-size:12.5px;color:var(--muted);padding:2px 0 4px}
.symg{display:grid;grid-template-columns:repeat(8,34px);gap:3px;padding:4px}
.symg button{height:34px;padding:0;justify-content:center;font:16px Arial,Helvetica,sans-serif;border:1px solid var(--line)}

/* ---------- ChemDraw window ---------- */
.cd{position:fixed;inset:0;z-index:30;background:var(--desk);display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
.cd-top{background:var(--chrome);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:6px 8px;overflow-x:auto;scrollbar-width:none}
.cd-ttl{font-weight:600;white-space:nowrap;padding:0 4px}
.cd-note{font-size:12.5px;color:var(--muted);white-space:nowrap}
.cd-top .sp{flex:1}
.cd-body{display:grid;grid-template-columns:auto minmax(0,1fr);min-height:0}
.palette{background:var(--chrome);border-right:1px solid var(--line);display:grid;grid-template-columns:repeat(3,36px);grid-auto-rows:36px!important;grid-auto-rows:38px;gap:3px;padding:8px 6px;overflow-y:auto;align-content:start;scrollbar-width:thin}
.palette .ps{grid-column:1/-1;height:1px;background:var(--line);margin:3px 2px;align-self:center}
.tl{border:1px solid transparent;background:none;border-radius:7px;display:grid;place-items:center;color:var(--ink);padding:0}
.tl:hover{background:var(--chrome-2);border-color:var(--line)}
.tl[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cd-canvas{position:relative;overflow:hidden;background:#fff;touch-action:none}
#cdSvg{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.cd-tip{position:absolute;left:10px;bottom:8px;background:rgba(255,255,255,.92);color:#4d5868;border:1px solid #dbe1ea;border-radius:7px;font-size:12px;padding:3px 8px;pointer-events:none;max-width:calc(100% - 20px)}
.cd-status{background:var(--chrome);border-top:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));overflow-x:auto;scrollbar-width:none;min-height:46px}
.chip{border:1px solid var(--line);background:var(--chrome-2);border-radius:999px;padding:4px 10px;font-family:var(--f-mono);font-size:12.5px;white-space:nowrap;flex:none}
.hint{color:var(--muted);font-size:12.5px;white-space:nowrap}
.b{border:1px solid var(--line);background:var(--chrome);border-radius:7px;height:32px;min-width:32px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;font-size:13px;font-weight:500;flex:none}
.b:hover{border-color:var(--accent)}
.b:disabled{opacity:.4;cursor:default}
.b.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.b.dng{color:var(--danger)}
.flt{position:fixed;z-index:60;border:1.5px solid #1f4fd6;border-radius:5px;padding:2px 6px;font:16px Arial,Helvetica,sans-serif;background:#fff;color:#000;min-width:90px;color-scheme:light;outline:none}
.pop{position:fixed;z-index:50;background:var(--chrome);border:1px solid var(--line);border-radius:10px;padding:8px;box-shadow:0 12px 30px rgba(10,20,40,.22);display:grid;grid-template-columns:repeat(3,96px);gap:6px;max-width:calc(100vw - 16px)}
.pop button{border:1px solid var(--line);background:#fff;border-radius:7px;height:78px;display:grid;grid-template-rows:1fr auto;align-items:center;justify-items:center;padding:4px;color:#222;font-size:11.5px}
.pop button:hover{border-color:var(--accent)}
.pop svg{max-width:84px;max-height:46px}
#toast{position:fixed;left:50%;bottom:calc(64px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--chrome);padding:9px 16px;border-radius:9px;font-size:13.5px;z-index:90;max-width:calc(100% - 32px)}
.sheet{position:fixed;inset:0;z-index:80;background:rgba(8,12,20,.55);display:grid;place-items:center;padding:16px}
.sheet>div{background:var(--chrome);border-radius:12px;padding:16px;max-width:720px;width:100%;display:grid;gap:12px;max-height:90vh;overflow:auto}
.sheet img{max-width:100%;background:#fff;border:1px solid var(--line)}
#exportHost{position:fixed;left:-12000px;top:0}
@media (max-width:760px){
  .rib{flex-wrap:nowrap;overflow-x:auto}
  .cd-body{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .palette{order:2;border-right:0;border-top:1px solid var(--line);display:flex;overflow-x:auto;overflow-y:hidden;padding:6px 8px;gap:3px}
  .palette .tl{flex:none;width:40px;height:40px}
  .palette .ps{width:1px;height:28px;margin:0 3px;flex:none;align-self:center}
  .cd-tip,.cd-note{display:none}
  .status .wc{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <div class="rib" id="rib" role="toolbar" aria-label="Formatting">
    <div class="grp">
      <button class="ib" id="bFile" aria-haspopup="true">File ▾</button>
      <button class="ib" data-cmd="undo" title="Undo (Ctrl+Z)" aria-label="Undo"><svg width="17" height="17" viewBox="0 0 18 18"><path d="M6 4 2.5 7.5 6 11M3 7.5h7.5a4.5 4.5 0 0 1 0 9H8" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
      <button class="ib" data-cmd="redo" title="Redo (Ctrl+Y)" aria-label="Redo"><svg width="17" height="17" viewBox="0 0 18 18"><path d="M12 4l3.5 3.5L12 11M15 7.5H7.5a4.5 4.5 0 0 0 0 9H10" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
    </div>
    <span class="sep"></span>
    <div class="grp">
      <select class="sel sty" id="sStyle" aria-label="Paragraph style"><option value="p">Normal</option><option value="h1">Heading 1</option><option value="h2">Heading 2</option><option value="h3">Heading 3</option></select>
      <select class="sel fam" id="sFont" aria-label="Font"></select>
      <select class="sel sz" id="sSize" aria-label="Font size"></select>
    </div>
    <span class="sep"></span>
    <div class="grp">
      <button class="ib" data-cmd="bold" title="Bold (Ctrl+B)" aria-label="Bold" aria-pressed="false"><b>B</b></button>
      <button class="ib" data-cmd="italic" title="Italic (Ctrl+I)" aria-label="Italic" aria-pressed="false"><i style="font-family:Georgia,serif">I</i></button>
      <button class="ib" data-cmd="underline" title="Underline (Ctrl+U)" aria-label="Underline" aria-pressed="false"><u>U</u></button>
      <button class="ib" data-cmd="strikeThrough" title="Strikethrough" aria-label="Strikethrough" aria-pressed="false"><s>ab</s></button>
      <button class="ib" data-cmd="subscript" title="Subscript (Ctrl+=)" aria-label="Subscript" aria-pressed="false">x<sub>2</sub></button>
      <button class="ib" data-cmd="superscript" title="Superscript (Ctrl+Shift++)" aria-label="Superscript" aria-pressed="false">x<sup>2</sup></button>
      <button class="ib" id="bColor" title="Font colour" aria-label="Font colour"><span class="cw"><b style="font-family:Georgia,serif">A</b><span class="cbar" id="cbarF" style="background:#c00000"></span></span></button><button class="ib dd" id="bColorDd" title="Choose font colour" aria-label="Choose font colour">▾</button>
      <button class="ib" id="bHi" title="Highlight" aria-label="Highlight"><span class="cw"><svg width="16" height="14" viewBox="0 0 16 14"><path d="M3 11l2-6 6-4 2 2-4 6-6 2Z" fill="none" stroke="currentColor" stroke-width="1.3"/></svg><span class="cbar" id="cbarH" style="background:#ffff00"></span></span></button><button class="ib dd" id="bHiDd" title="Choose highlight colour" aria-label="Choose highlight colour">▾</button>
      <button class="ib" data-cmd="removeFormat" title="Clear formatting" aria-label="Clear formatting"><svg width="17" height="17" viewBox="0 0 18 18"><path d="M4 4h10M9 4l-2.5 10M3 15l12-12" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
      <input type="color" class="colin" id="cF" value="#c00000" tabindex="-1" aria-hidden="true"><input type="color" class="colin" id="cH" value="#ffff00" tabindex="-1" aria-hidden="true">
    </div>
    <span class="sep"></span>
    <div class="grp">
      <button class="ib" data-cmd="justifyLeft" title="Align left" aria-label="Align left" aria-pressed="false"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M2 3h12M2 6.3h8M2 9.6h12M2 13h8" stroke="currentColor" stroke-width="1.5"/></svg></button>
      <button class="ib" data-cmd="justifyCenter" title="Centre" aria-label="Centre" aria-pressed="false"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M2 3h12M4 6.3h8M2 9.6h12M4 13h8" stroke="currentColor" stroke-width="1.5"/></svg></button>
      <button class="ib" data-cmd="justifyRight" title="Align right" aria-label="Align right" aria-pressed="false"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M2 3h12M6 6.3h8M2 9.6h12M6 13h8" stroke="currentColor" stroke-width="1.5"/></svg></button>
      <button class="ib" data-cmd="justifyFull" title="Justify" aria-label="Justify" aria-pressed="false"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M2 3h12M2 6.3h12M2 9.6h12M2 13h12" stroke="currentColor" stroke-width="1.5"/></svg></button>
      <button class="ib" data-cmd="insertUnorderedList" title="Bullets" aria-label="Bullets" aria-pressed="false"><svg width="17" height="16" viewBox="0 0 17 16"><circle cx="2.5" cy="4" r="1.3" fill="currentColor"/><circle cx="2.5" cy="8" r="1.3" fill="currentColor"/><circle cx="2.5" cy="12" r="1.3" fill="currentColor"/><path d="M6 4h10M6 8h10M6 12h10" stroke="currentColor" stroke-width="1.4"/></svg></button>
      <button class="ib" data-cmd="insertOrderedList" title="Numbering" aria-label="Numbering" aria-pressed="false"><svg width="17" height="16" viewBox="0 0 17 16"><text x="0" y="6" font-size="6" fill="currentColor" font-family="Arial">1</text><text x="0" y="14" font-size="6" fill="currentColor" font-family="Arial">2</text><path d="M6 4h10M6 12h10" stroke="currentColor" stroke-width="1.4"/></svg></button>
      <button class="ib" data-cmd="outdent" title="Decrease indent" aria-label="Decrease indent"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M7 3h7M7 8h7M7 13h7M5 5.5 2 8l3 2.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
      <button class="ib" data-cmd="indent" title="Increase indent" aria-label="Increase indent"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M7 3h7M7 8h7M7 13h7M2 5.5 5 8l-3 2.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
      <button class="ib" id="bLine" title="Line spacing" aria-label="Line spacing" aria-haspopup="true"><svg width="17" height="16" viewBox="0 0 17 16"><path d="M7 3h9M7 8h9M7 13h9M3 1.5v13M1 4l2-2.5L5 4M1 12l2 2.5L5 12" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>▾</button>
    </div>
    <span class="sep"></span>
    <div class="grp">
      <button class="ib" id="bTable" title="Insert table" aria-haspopup="true"><svg width="16" height="16" viewBox="0 0 16 16"><rect x="1.5" y="2" width="13" height="12" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M1.5 6h13M1.5 10h13M6 2v12M10.5 2v12" stroke="currentColor" stroke-width="1"/></svg>Table</button>
      <button class="ib" id="bImg" title="Insert picture"><svg width="16" height="16" viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M2 12l4-4 3 3 2-2 3 3" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="11" cy="6" r="1.2" fill="currentColor"/></svg>Picture</button>
      <button class="ib" id="bSym" title="Insert symbol" aria-haspopup="true">Ω Symbol</button>
      <button class="ib" id="bPb" title="Page break (Ctrl+Enter)"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M3 1v4h10V1M3 15v-4h10v4" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M1 8h14" stroke="currentColor" stroke-dasharray="2 1.5"/></svg>Page break</button>
    </div>

 ['Chloroform','CHCl3',1.489],['Sodium hydroxide','NaOH',null],['50% aq. NaOH','NaOH',1.52,50],['Cyclohexene','C6H10',0.811],
 ['Benzyltriethylammonium chloride','C13H22ClN',null],['Tetrabutylammonium bromide','C16H36BrN',null],['Dichloromethane','CH2Cl2',1.326],['Water','H2O',1.000],
 ['Diethyl ether','C4H10O',0.713],['Magnesium sulfate (anhydrous)','MgSO4',null],['Sodium sulfate (anhydrous)','Na2SO4',null],['Sodium chloride','NaCl',null],

 ['Potassium tert-butoxide','C4H9KO',null],['(E)-2-Butene','C4H8',null],['(Z)-2-Butene','C4H8',null],['Ethanol','C2H6O',0.789],['Hexane','C6H14',0.659],
 ['Acetone','C3H6O',0.784],['Ethyl acetate','C4H8O2',0.902],['Triethylamine','C6H15N',0.726],['Maleic anhydride','C4H2O3',null],['Anthracene','C14H10',null],

function addC(t,c,m=1){for(const k in c)t[k]=(t[k]||0)+c[k]*m;return t;}
function parseGroup(s){let i=0;const st=[{}];
 while(i<s.length){const ch=s[i];
  if(ch==='('||ch==='['){st.push({});i++;}
  else if(ch===')'||ch===']'){if(st.length<2)return null;const g=st.pop();i++;let n='';while(i<s.length&&/\d/.test(s[i]))n+=s[i++];addC(st[st.length-1],g,n?+n:1);}
  else if(/[A-Z]/.test(ch)){let sym=ch;i++;while(i<s.length&&/[a-z]/.test(s[i]))sym+=s[i++];let n='';while(i<s.length&&/\d/.test(s[i]))n+=s[i++];
   let c;if(AW[sym])c={[sym]:1};else if(ABBR[sym])c=parseGroup(ABBR[sym].f);else if(AW[sym[0]]&&sym.length===2&&AW[sym.slice(0,1)]){return null;}else return null;
   if(!c)return null;addC(st[st.length-1],c,n?+n:1);}
  else return null;}
 return st.length===1?st[0]:null;}
function parseFormula(s){s=String(s||'').replace(/\s+/g,'');if(!s)return null;const tot={};
 for(let part of s.split(/[·.*•]/)){if(!part)continue;let m=1;const mm=part.match(/^(\d+)(.*)$/);if(mm){m=+mm[1];part=mm[2];}const c=parseGroup(part);if(!c)return null;addC(tot,c,m);}
 return Object.keys(tot).length?tot:null;}
function massOf(c){let m=0;for(const k in c){if(!AW[k])return null;m+=AW[k]*c[k];}return m;}
function exactOf(c){let m=0;for(const k in c){if(MONO[k]==null)return null;m+=MONO[k]*c[k];}return m;}
function hillKeys(c){const ks=Object.keys(c).filter(k=>c[k]>0);if(c.C)return ['C',...(c.H?['H']:[]),...ks.filter(k=>k!=='C'&&k!=='H').sort()];return ks.sort();}
function formulaHTML(c){return hillKeys(c).map(k=>k+(c[k]>1?'<sub>'+c[k]+'</sub>':'')).join('');}
function formulaText(c){return hillKeys(c).map(k=>k+(c[k]>1?c[k]:'')).join('');}

/* ================= text with chemical formatting ================= */
const _ctx=document.createElement('canvas').getContext('2d');
const DFONT='Arial, Helvetica, sans-serif';
function tw(t,size,it,b){_ctx.font=(it?'italic ':'')+(b?'bold ':'')+size+'px '+DFONT;return _ctx.measureText(t).width;}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
const f2=n=>Math.round(n*100)/100;
function isFormulaWord(w){
 if(!/^[A-Z(\[]/.test(w)||!/\d/.test(w))return false;
 const toks=w.match(/[A-Z][a-z]*|[a-z]+|\d+|[()\[\]]/g)||[];if(toks.join('')!==w)return false;
 let sym=0,first=null;for(const t of toks){if(/^[a-z]/.test(t))return false;if(/^[A-Z]/.test(t)){if(!(AW[t]||ABBR[t]))return false;sym++;if(!first)first=t;}}
 if(sym===1&&first==='C')return false; /* C1, C2 … are atom numbers */
 return sym>=1&&/[A-Za-z)\]]\d/.test(w);}
function autoFormula(s,it,b){const out=[];const push=(t,k)=>{if(!t)return;const l=out[out.length-1];if(l&&l.k==='n'&&k==='n')l.t+=t;else out.push({t,k,i:it,b});};
 const re=/[A-Za-z0-9()\[\]]+|[^A-Za-z0-9()\[\]]+/g;let m;
 while((m=re.exec(s))){const w=m[0];
  if(/^sp[23]$/.test(w)){push('sp','n');push(w[2],'sup');continue;}
  if(/^SN[12]$/.test(w)){push('S','n');push('N','sub');push(w[2],'n');continue;}
  if(isFormulaWord(w)){let prev='';for(const p of w.match(/\d+|\D+/g)){if(/^\d+$/.test(p)&&/[A-Za-z)\]]$/.test(prev))push(p,'sub');else push(p,'n');prev=p;}}
  else push(w,'n');}
 return out;}
function chemRuns(str){str=String(str??'').replace(/<=>/g,'⇌').replace(/->/g,'→');
 const lines=[[]];let i=0,it=false,bd=false,buf='';
 const flush=()=>{if(buf){for(const r of autoFormula(buf,it,bd))lines[lines.length-1].push(r);buf='';}};
 while(i<str.length){const c=str[i];
  if(c==='\n'){flush();lines.push([]);i++;continue;}
  if(c==='*'&&str[i+1]==='*'){flush();bd=!bd;i+=2;continue;}
  if(c==='*'){flush();it=!it;i++;continue;}
  if((c==='_'||c==='^')&&i+1<str.length&&str[i+1]!==' '){let t;
   if(str[i+1]==='{'){const j=str.indexOf('}',i+2);if(j<0){buf+=c;i++;continue;}t=str.slice(i+2,j);i=j+1;}
   else{const m=str.slice(i+1).match(/^(\d+[+\-−]?|[+\-−]|\S)/);t=m[0];i+=1+t.length;}
   flush();lines[lines.length-1].push({t:t.replace(/-/g,'−'),k:c==='_'?'sub':'sup',i:it,b:bd});continue;}
  buf+=c;i++;}
 flush();return lines;}
function inlineHTML(s){return chemRuns(s).map(runs=>runs.map(r=>{let h=esc(r.t);if(r.k==='sub')h='<sub>'+h+'</sub>';if(r.k==='sup')h='<sup>'+h+'</sup>';if(r.i)h='<i>'+h+'</i>';if(r.b)h='<b>'+h+'</b>';return h;}).join('')).join('<br>');}
function richBlocks(str){const out=[];for(const para of String(str||'').split(/\n\s*\n/)){if(!para.trim())continue;
  const lines=para.split('\n');let html='',list=[],txt=[];
  const fl=()=>{if(txt.length){html+='<p style="margin:0 0 4px">'+inlineHTML(txt.join('\n'))+'</p>';txt=[];}if(list.length){html+='<ul>'+list.map(l=>'<li>'+inlineHTML(l)+'</li>').join('')+'</ul>';list=[];}};
  for(const l of lines){const m=l.match(/^\s*[-•]\s+(.*)$/);if(m){if(txt.length){const t=txt;txt=[];html+='<p style="margin:0 0 4px">'+inlineHTML(t.join('\n'))+'</p>';}list.push(m[1]);}else{if(list.length){html+='<ul>'+list.map(x=>'<li>'+inlineHTML(x)+'</li>').join('')+'</ul>';list=[];}txt.push(l);}}
  fl();out.push(html);}
 return out;}

/* ================= drawing model & renderer (ACS Document 1996 proportions) ================= */
const BL=30, LW=1.25, BOLDW=4.2, DSP=5.4, HSP=5.2, FS=20.8, SUBF=0.72, WEDGEW=3.1;
function newDrawing(){return{atoms:[],bonds:[],arrows:[],texts:[],n:1};}
function normalize(d){for(const k of['atoms','bonds','arrows','texts'])if(!Array.isArray(d[k]))d[k]=[];let mx=0;for(const k of['atoms','bonds','arrows','texts'])for(const o of d[k]){const n=parseInt(String(o.id).replace(/\D/g,''))||0;if(n>mx)mx=n;}d.n=Math.max(d.n||1,mx+1);return d;}
function nid(d){return 'k'+(d.n++);}
function analyze(d){const amap=new Map(d.atoms.map(a=>[a.id,a]));const adj=new Map(d.atoms.map(a=>[a.id,[]]));
 for(const b of d.bonds){if(!amap.has(b.a)||!amap.has(b.b))continue;adj.get(b.a).push({b,o:b.b});adj.get(b.b).push({b,o:b.a});}return{amap,adj};}
function hCount(a,adjA){const t=a.t||'C';if(VAL[t]==null)return 0;let v=VAL[t];const q=a.charge||0;
 if(t==='C'||t==='Si')v-=q?Math.abs(q):2*(a.lp||0);else if(t==='B')v-=q;else if(t==='H')v-=Math.abs(q);else v+=q;
 v-=(a.rad||0);let bo=0;for(const e of adjA)bo+=e.b.style==='dash'?1:(e.b.order||1);return Math.max(0,v-bo+(a.hOff||0));}
function tokLabel(s){const ps=[];const re=/[A-Z][a-z]*|[a-z]+|\d+|[^A-Za-z\d]+/g;let m,prev='';while((m=re.exec(s))){const t=m[0];ps.push({t,sub:/^\d+$/.test(t)&&/[A-Za-z)\]]$/.test(prev)});prev=t;}return ps;}
function atomLabel(a,adjA,amap){const t=a.t||'C';const deg=adjA.length;
 if(t==='C'&&!a.showC&&deg>0)return null;
 let mdx=0;for(const e of adjA){const o=amap.get(e.o);const L=Math.hypot(o.x-a.x,o.y-a.y)||1;mdx+=(o.x-a.x)/L;}if(deg)mdx/=deg;
 const right=mdx>0.25;
 if(AW[t]){const h=hCount(a,adjA);if(!h)return{pieces:[{t}],anchor:0,hSide:null};
  let left=a.hLeft!=null?a.hLeft:(deg?right:((t==='O'||t==='S')));
  const hp=[{t:'H'}];if(h>1)hp.push({t:String(h),sub:true});
  return left?{pieces:[...hp,{t}],anchor:hp.length,hSide:'left'}:{pieces:[{t},...hp],anchor:0,hSide:'right'};}
 if(ABBR[t]){const rev=right&&ABBR[t].rev;const txt=rev?ABBR[t].rev:t;const ps=tokLabel(txt);let anc=0;if(rev){for(let i=ps.length-1;i>=0;i--)if(/^[A-Z]/.test(ps[i].t)){anc=i;break;}}

 const ps=tokLabel(t);let anc=0;for(let i=0;i<ps.length;i++)if(/^[A-Z]/.test(ps[i].t)){anc=i;break;}
 return{pieces:ps,anchor:anc,hSide:ps.length>1?'right':null};}
function layoutLabel(a,L){const ws=L.pieces.map(p=>tw(p.t,p.sub?FS*SUBF:FS));let before=0;for(let i=0;i<L.anchor;i++)before+=ws[i];
 const x0=a.x-before-ws[L.anchor]/2;let x=x0;const base=a.y+FS*0.36;let s='',sub=false;
 L.pieces.forEach((p,i)=>{s+=`<text x="${f2(x)}" y="${f2(base+(p.sub?FS*0.22:0))}" font-size="${f2(p.sub?FS*SUBF:FS)}">${esc(p.t)}</text>`;if(p.sub)sub=true;x+=ws[i];});
 const m=2.4;return{svg:s,hSide:L.hSide,box:{x1:x0-m,y1:a.y-FS*0.39-m,x2:x+m,y2:a.y+FS*(sub?0.52:0.39)+m}};}
function inBox(p,b,m=0){return b&&p.x>=b.x1-m&&p.x<=b.x2+m&&p.y>=b.y1-m&&p.y<=b.y2+m;}
function exitT(p,dx,dy,b){let t=Infinity;if(dx>0)t=Math.min(t,(b.x2-p.x)/dx);else if(dx<0)t=Math.min(t,(b.x1-p.x)/dx);if(dy>0)t=Math.min(t,(b.y2-p.y)/dy);else if(dy<0)t=Math.min(t,(b.y1-p.y)/dy);return t;}
function clipSeg(p,q,bp,bq){let P={...p},Q={...q};const dx=Q.x-P.x,dy=Q.y-P.y;let t0=0,t1=1;
 if(bp&&inBox(p,bp))t0=exitT(p,dx,dy,bp);if(bq&&inBox(q,bq))t1=1-exitT(q,-dx,-dy,bq);if(t1-t0<0.02)return null;
 return[{x:p.x+dx*t0,y:p.y+dy*t0},{x:p.x+dx*t1,y:p.y+dy*t1}];}
function ringPath(b,adj){const start=b.a,goal=b.b;const prev=new Map([[start,null]]);let fr=[start];
 for(let dep=0;dep<7&&fr.length;dep++){const nf=[];for(const u of fr)for(const e of adj.get(u)||[]){if(e.b===b||prev.has(e.o))continue;prev.set(e.o,u);if(e.o===goal){const path=[];let x=goal;while(x!=null){path.push(x);x=prev.get(x);}return path;}nf.push(e.o);}fr=nf;}return null;}
function dblSide(b,A,B,adj,amap,lab){const na=adj.get(A.id).filter(e=>e.o!==B.id),nb=adj.get(B.id).filter(e=>e.o!==A.id);
 if((lab.get(A.id)&&!na.length)||(lab.get(B.id)&&!nb.length))return 0;if(!na.length&&!nb.length)return 0;

  q:'Predict the stereochemical outcome for the addition of singlet and triplet carbenes to alkenes.\n1. Singlet dichlorocarbene (:CCl2) adding to (a) (*E*)-2-butene and (b) (*Z*)-2-butene.\n2. Triplet carbene (·CH2·) adding to (a) (*E*)-2-butene and (b) (*Z*)-2-butene.\n(a) Draw all possible stereoisomeric products using wedge–dash notation. (b) Classify each reaction as stereospecific, stereoselective or non-stereoselective. (c) State whether each product or product mixture is optically active or inactive. (d) Briefly explain the stereochemical difference between :CCl2 and CH2 additions.',
  a:'**(a) Products** (drawn above in wedge–dash notation)\n- 1(a) Singlet :CCl2 + (*E*)-2-butene gives only *trans*-1,1-dichloro-2,3-dimethylcyclopropane, as a 1 : 1 pair of enantiomers, (2*R*,3*R*) and (2*S*,3*S*).\n- 1(b) Singlet :CCl2 + (*Z*)-2-butene gives only *cis*-1,1-dichloro-2,3-dimethylcyclopropane, the meso compound (2*R*,3*S*).\n- 2(a) and 2(b) Triplet ·CH2· + either alkene gives a mixture of *cis*-1,2-dimethylcyclopropane (meso) and *trans*-1,2-dimethylcyclopropane (racemic, (1*R*,2*R*) + (1*S*,2*S*)). Both alkenes give the same mixture.\n\n**(b) Classification**\n- Singlet additions are **stereospecific**: the two stereoisomeric alkenes give stereoisomerically different products and the alkene geometry is retained (*syn* addition). A stereospecific reaction is also stereoselective.\n- Triplet additions are **non-stereoselective (non-stereospecific)**: (*E*)- and (*Z*)-2-butene give the same *cis*/*trans* mixture, so the starting geometry is lost.\n\n**(c) Optical activity.** Every product or mixture is optically inactive.\n- 1(a): each enantiomer is chiral, but they form in equal amounts (racemate), so their rotations cancel.\n- 1(b): the meso product has an internal mirror plane and is achiral.\n- 2(a), 2(b): the *cis* isomer is meso (achiral) and the *trans* isomer forms as a racemate.\nAchiral starting materials with no chiral reagent, catalyst or solvent cannot give an excess of one enantiomer.\n\n**(d) Why the two carbenes differ**\nSinglet :CCl2 has both nonbonding electrons paired in one sp2 orbital and an empty p orbital; π-donation from the chlorine lone pairs into that p orbital makes the singlet its ground state. It accepts the alkene π electrons and donates its lone pair at the same time, so both C–C bonds form in one concerted step. There is no intermediate and no time for bond rotation, so the alkene geometry is carried into the cyclopropane.\nTriplet CH2 has two unpaired electrons with parallel spins. It forms one C–C bond first, giving a triplet 1,3-diradical. The ring cannot close until one electron inverts its spin (intersystem crossing), which is slow compared with rotation about the former C=C bond, now a single bond. Rotation scrambles the geometry, so both *cis* and *trans* cyclopropanes form. This difference is the basis of the Skell–Woodworth rule [1, 2].',

  for(let i=0;i<U.length;i++){const{t,b}=pos[i];if(b-t<=0.5&&!U[i].force)continue;const pg=Math.floor(t/PP),cTop=pg*PP+MT,cBot=cTop+CH;let target=null,j=i;
   if(t>cBot-1)target=(pg+1)*PP+MT;
   else if(t<cTop-0.5)target=cTop;
   else if(U[i].force&&t>cTop+1)target=(pg+1)*PP+MT;
   else if(b>cBot+0.5&&t>cTop+1&&b-t<=CH){target=(pg+1)*PP+MT;while(j>0&&U[j-1].keep&&Math.floor(pos[j-1].t/PP)===pg&&pos[j-1].t>cTop+1)j--;}

function snapCurve(p){let best=null,bd=0.4*BL;for(const a of ED.d.atoms){const d=dist(p,a);if(d<bd){bd=d;best={x:a.x,y:a.y,atom:true};}}
 for(const b of ED.d.bonds){const A=A_(b.a),B=A_(b.b);if(!A||!B)continue;const m={x:(A.x+B.x)/2,y:(A.y+B.y)/2};const d=dist(p,m);if(d<bd){bd=d;best={...m,atom:false};}}return best||{x:p.x,y:p.y};}
function makeArrow(t,p1,p2,moved){const kind=AKIND[t];
 if(kind==='curve2'||kind==='curve1'){let a=snapCurve(p1),b=moved?snapCurve(p2):{x:a.x+1.3*BL,y:a.y};let L=dist(a,b);if(L<8){b={x:a.x+1.3*BL,y:a.y};L=1.3*BL;}const ux=(b.x-a.x)/L,uy=(b.y-a.y)/L;
  const c={x:(a.x+b.x)/2+uy*0.45*L,y:(a.y+b.y)/2-ux*0.45*L};const pull=(q,s)=>{const dx=c.x-q.x,dy=c.y-q.y,l=Math.hypot(dx,dy)||1;return{x:q.x+dx/l*s,y:q.y+dy/l*s};};

 else{let b=p2;if(!moved||dist(p1,p2)<0.6*BL)b={x:p1.x+2.5*BL,y:p1.y};else{const an=snapAng(Math.atan2(p2.y-p1.y,p2.x-p1.x),Math.PI/12);const L=dist(p1,p2);b={x:p1.x+L*Math.cos(an),y:p1.y+L*Math.sin(an)};}
  snap();ED.d.arrows.push({id:nid(ED.d),kind,x1:p1.x,y1:p1.y,x2:b.x,y2:b.y});}
