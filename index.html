<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChemWord</title>
<meta name="description" content="Word-style document editor for chemistry: structures, mechanisms and lab flowcharts built in. Exports vector PDF and Word files.">
<link rel="stylesheet" href="css/word.css">
</head>
<body>
<div class="app">
  <header class="titlebar">
    <div class="brand"><svg width="18" height="18" viewBox="0 0 20 20"><path d="M10 2.5 16.5 6.3v7.4L10 17.5 3.5 13.7V6.3Z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6 7.4 10 5.1M14 7.2v5.6" stroke="currentColor" stroke-width="1.2"/></svg><span>ChemWord</span></div>
    <div class="qa">
      <button class="ib qb" data-cmd="undo" title="Undo (Ctrl+Z)" aria-label="Undo"><svg width="17" height="17" viewBox="0 0 18 18"><path d="M6 4 2.5 7.5 6 11M3 7.5h7.5a4.5 4.5 0 0 1 0 9H8" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
      <button class="ib qb" data-cmd="redo" title="Redo (Ctrl+Y)" aria-label="Redo"><svg width="17" height="17" viewBox="0 0 18 18"><path d="M12 4l3.5 3.5L12 11M15 7.5H7.5a4.5 4.5 0 0 0 0 9H10" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
      <button class="ib qb" id="qOpen" title="Open a saved document: .docx, .pdf or .json from ChemWord (Ctrl+O)" aria-label="Open"><svg width="17" height="17" viewBox="0 0 18 18"><path d="M2.5 14.5V4h4.5l1.5 1.8h7v2M2.5 14.5l2.3-6.2h11.7l-2.3 6.2Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg></button>
      <button class="ib qb" id="qSave" title="Save project (Ctrl+S)" aria-label="Save project"><svg width="17" height="17" viewBox="0 0 18 18"><path d="M3 2.5h9.5L15.5 5.5V15.5H3Z M6 2.5v4h6v-4M5.5 15.5v-5h7v5" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></button>
    </div>
    <div class="doctitle" id="docTitle">Document</div>
    <button class="ib pri" id="qPdf" title="Export PDF">Export PDF</button>
  </header>
  <nav class="tabs" role="tablist" aria-label="Ribbon">
    <button class="tab file" id="bFile" aria-haspopup="true">File</button>
    <button class="tab" data-tab="home" aria-selected="true">Home</button>
    <button class="tab" data-tab="insert" aria-selected="false">Insert</button>
    <button class="tab" data-tab="view" aria-selected="false">View</button>
  </nav>
  <div class="rib" id="rib" role="toolbar" aria-label="Ribbon">
    <div class="pane" data-pane="home">
      <div class="rgrp"><div class="rrow">
      <select class="sel sty" id="sStyle" aria-label="Paragraph style"><option value="p">Normal</option><option value="h1">Heading 1</option><option value="h2">Heading 2</option><option value="h3">Heading 3</option></select>
      <select class="sel fam" id="sFont" aria-label="Font"></select>
      <select class="sel sz" id="sSize" aria-label="Font size"></select>
      </div><div class="rrow">
      <button class="ib" data-cmd="bold" title="Bold (Ctrl+B)" aria-label="Bold" aria-pressed="false"><b>B</b></button>
      <button class="ib" data-cmd="italic" title="Italic (Ctrl+I)" aria-label="Italic" aria-pressed="false"><i style="font-family:Georgia,serif">I</i></button>
      <button class="ib" data-cmd="underline" title="Underline (Ctrl+U)" aria-label="Underline" aria-pressed="false"><u>U</u></button>
      <button class="ib" data-cmd="strikeThrough" title="Strikethrough" aria-label="Strikethrough" aria-pressed="false"><s>ab</s></button>
      <button class="ib" data-cmd="subscript" title="Subscript (Ctrl+=)" aria-label="Subscript" aria-pressed="false">x<sub>2</sub></button>
      <button class="ib" data-cmd="superscript" title="Superscript (Ctrl+Shift++)" aria-label="Superscript" aria-pressed="false">x<sup>2</sup></button>
      <button class="ib" id="bColor" title="Font colour" aria-label="Font colour"><span class="cw"><b style="font-family:Georgia,serif">A</b><span class="cbar" id="cbarF" style="background:#c00000"></span></span></button><button class="ib dd" id="bColorDd" title="Choose font colour" aria-label="Choose font colour">▾</button>
      <button class="ib" id="bHi" title="Highlight" aria-label="Highlight"><span class="cw"><svg width="16" height="14" viewBox="0 0 16 14"><path d="M3 11l2-6 6-4 2 2-4 6-6 2Z" fill="none" stroke="currentColor" stroke-width="1.3"/></svg><span class="cbar" id="cbarH" style="background:#ffff00"></span></span></button><button class="ib dd" id="bHiDd" title="Choose highlight colour" aria-label="Choose highlight colour">▾</button>
      <button class="ib" data-cmd="removeFormat" title="Clear formatting" aria-label="Clear formatting"><svg width="17" height="17" viewBox="0 0 18 18"><path d="M4 4h10M9 4l-2.5 10M3 15l12-12" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
      <input type="color" class="colin" id="cF" value="#c00000" tabindex="-1" aria-hidden="true"><input type="color" class="colin" id="cH" value="#ffff00" tabindex="-1" aria-hidden="true">
      </div><div class="rlbl">Font</div></div>
      <div class="rgrp"><div class="rrow">
      <button class="ib" data-cmd="justifyLeft" title="Align left" aria-label="Align left" aria-pressed="false"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M2 3h12M2 6.3h8M2 9.6h12M2 13h8" stroke="currentColor" stroke-width="1.5"/></svg></button>
      <button class="ib" data-cmd="justifyCenter" title="Centre" aria-label="Centre" aria-pressed="false"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M2 3h12M4 6.3h8M2 9.6h12M4 13h8" stroke="currentColor" stroke-width="1.5"/></svg></button>
      <button class="ib" data-cmd="justifyRight" title="Align right" aria-label="Align right" aria-pressed="false"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M2 3h12M6 6.3h8M2 9.6h12M6 13h8" stroke="currentColor" stroke-width="1.5"/></svg></button>
      <button class="ib" data-cmd="justifyFull" title="Justify" aria-label="Justify" aria-pressed="false"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M2 3h12M2 6.3h12M2 9.6h12M2 13h12" stroke="currentColor" stroke-width="1.5"/></svg></button>
      <button class="ib" data-cmd="insertUnorderedList" title="Bullets" aria-label="Bullets" aria-pressed="false"><svg width="17" height="16" viewBox="0 0 17 16"><circle cx="2.5" cy="4" r="1.3" fill="currentColor"/><circle cx="2.5" cy="8" r="1.3" fill="currentColor"/><circle cx="2.5" cy="12" r="1.3" fill="currentColor"/><path d="M6 4h10M6 8h10M6 12h10" stroke="currentColor" stroke-width="1.4"/></svg></button>
      <button class="ib" data-cmd="insertOrderedList" title="Numbering" aria-label="Numbering" aria-pressed="false"><svg width="17" height="16" viewBox="0 0 17 16"><text x="0" y="6" font-size="6" fill="currentColor" font-family="Arial">1</text><text x="0" y="14" font-size="6" fill="currentColor" font-family="Arial">2</text><path d="M6 4h10M6 12h10" stroke="currentColor" stroke-width="1.4"/></svg></button>
      <button class="ib" data-cmd="outdent" title="Decrease indent" aria-label="Decrease indent"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M7 3h7M7 8h7M7 13h7M5 5.5 2 8l3 2.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
      <button class="ib" data-cmd="indent" title="Increase indent" aria-label="Increase indent"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M7 3h7M7 8h7M7 13h7M2 5.5 5 8l-3 2.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
      <button class="ib" id="bLine" title="Line spacing" aria-label="Line spacing" aria-haspopup="true"><svg width="17" height="16" viewBox="0 0 17 16"><path d="M7 3h9M7 8h9M7 13h9M3 1.5v13M1 4l2-2.5L5 4M1 12l2 2.5L5 12" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>▾</button>
      </div><div class="rlbl">Paragraph</div></div>
      <div class="rgrp"><div class="rrow">
        <button class="ib big" data-ins="structure" title="Insert a chemical structure, reaction or mechanism"><svg width="26" height="26" viewBox="0 0 20 20"><path d="M10 2.5 16.5 6.3v7.4L10 17.5 3.5 13.7V6.3Z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6 7.4 10 5.1M14 7.2v5.6" stroke="currentColor" stroke-width="1.2"/></svg><span>Structure</span></button>
        <button class="ib big" data-ins="flowchart" title="Insert a lab procedure flowchart"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="3" width="8" height="6"/><rect x="14" y="3" width="8" height="6"/><rect x="8" y="15" width="8" height="6"/><path d="M10 6h4M18 9v3H12v3"/><path d="M12.6 13.6 12 15l-.6-1.4" stroke-linejoin="round"/></svg><span>Flowchart</span></button>
        <button class="ib big" id="bFormula" title="Format chemical formulas in the selection (or the whole document): CaCl2 → CaCl₂, Na+ → Na⁺"><span class="fx">X<sub>2</sub></span><span>Formulas</span></button>
      </div><div class="rlbl">Chemistry</div></div>
    </div>
    <div class="pane" data-pane="insert" hidden>
      <div class="rgrp"><div class="rrow">
        <button class="ib big" data-ins="structure" title="Insert a chemical structure, reaction or mechanism (opens the drawing editor)"><svg width="26" height="26" viewBox="0 0 20 20"><path d="M10 2.5 16.5 6.3v7.4L10 17.5 3.5 13.7V6.3Z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6 7.4 10 5.1M14 7.2v5.6" stroke="currentColor" stroke-width="1.2"/></svg><span>Structure</span></button>
        <button class="ib big" data-ins="flowchart" title="Insert a lab procedure flowchart with glassware drawings (opens the flowchart wizard)"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="3" width="8" height="6"/><rect x="14" y="3" width="8" height="6"/><rect x="8" y="15" width="8" height="6"/><path d="M10 6h4M18 9v3H12v3"/><path d="M12.6 13.6 12 15l-.6-1.4" stroke-linejoin="round"/></svg><span>Flowchart</span></button>
      </div><div class="rlbl">Chemistry</div></div>
      <div class="rgrp"><div class="rrow">
        <button class="ib big" id="bTable" title="Insert table" aria-haspopup="true"><svg width="26" height="26" viewBox="0 0 16 16"><rect x="1.5" y="2" width="13" height="12" fill="none" stroke="currentColor" stroke-width="1.1"/><path d="M1.5 6h13M1.5 10h13M6 2v12M10.5 2v12" stroke="currentColor" stroke-width=".9"/></svg><span>Table</span></button>
        <button class="ib big" id="bImg" title="Insert picture"><svg width="26" height="26" viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="1" fill="none" stroke="currentColor" stroke-width="1.1"/><path d="M2 12l4-4 3 3 2-2 3 3" fill="none" stroke="currentColor" stroke-width="1"/><circle cx="11" cy="6" r="1.2" fill="currentColor"/></svg><span>Picture</span></button>
        <button class="ib big" id="bSym" title="Insert symbol" aria-haspopup="true"><span class="fx">Ω</span><span>Symbol</span></button>
        <button class="ib big" id="bPb" title="Page break (Ctrl+Enter)"><svg width="26" height="26" viewBox="0 0 16 16"><path d="M3 1v4h10V1M3 15v-4h10v4" fill="none" stroke="currentColor" stroke-width="1.1"/><path d="M1 8h14" stroke="currentColor" stroke-dasharray="2 1.5"/></svg><span>Page break</span></button>
      </div><div class="rlbl">Insert</div></div>
    </div>
    <div class="pane" data-pane="view" hidden>
      <div class="rgrp"><div class="rrow">
        <button class="ib" id="vZoomOut" title="Zoom out">− Zoom out</button><button class="ib" id="vZoomIn" title="Zoom in">+ Zoom in</button><button class="ib" id="vFit" title="Fit page width">Page width</button><button class="ib" id="v100" title="Actual size">100%</button>
      </div><div class="rlbl">Zoom</div></div>
      <div class="rgrp"><div class="rrow">
        <label class="ck"><input type="checkbox" id="optPn"> Page numbers</label>
        <label class="ck"><input type="checkbox" id="optChem"> Format formulas while typing</label>
      </div><div class="rlbl">Options</div></div>
    </div>
    <div class="grp tgrp" id="gTable" hidden><span class="lbl">Table</span>
      <button class="ib" data-t="rowA" title="Insert row above">Row ↑</button><button class="ib" data-t="rowB" title="Insert row below">Row ↓</button><button class="ib" data-t="colL" title="Insert column left">Col ←</button><button class="ib" data-t="colR" title="Insert column right">Col →</button>
      <button class="ib" data-t="delRow" title="Delete row">− Row</button><button class="ib" data-t="delCol" title="Delete column">− Col</button><button class="ib" data-t="delTab" title="Delete table" style="color:var(--danger)">Delete table</button></div>
    <div class="grp tgrp igrp" id="gImg" hidden><span class="lbl">Picture</span>
      <button class="ib" data-i="25">25%</button><button class="ib" data-i="50">50%</button><button class="ib" data-i="75">75%</button><button class="ib" data-i="100">100%</button><button class="ib" data-i="del" style="color:var(--danger)">Delete</button></div>
  </div>
  <div class="scroller" id="scroller">
    <div class="stage" id="stage">
      <div class="paper" id="paper">
        <div class="pbg" id="pbg"></div>
        <div class="doc" id="doc" contenteditable="true" spellcheck="true" role="textbox" aria-multiline="true" aria-label="Document"></div>
      </div>
    </div>
  </div>
  <div class="status">
    <span id="stPage">Page 1 of 1</span><span class="wc" id="stWords">0 words</span><span class="sp"></span>
    <button class="ib" id="zOut" title="Zoom out" aria-label="Zoom out">−</button><button class="ib zl" id="zFit" title="Fit page width">100%</button><button class="ib" id="zIn" title="Zoom in" aria-label="Zoom in">+</button>
  </div>
</div>

<div class="menu" id="mFile" hidden>
  <button data-f="new">New blank document</button>
  <button data-f="open">Open a saved document… (.docx, .pdf, .json)</button>
  <button data-f="save">Save project (.json)</button>
  <hr>
  <button data-f="docx">Export as Word (.docx)</button>
  <button data-f="pdf">Export as PDF</button>
  <hr>
  <button data-f="merge">Merge PDFs… (combine files in any order)</button>
  <hr>
  <button data-f="chemsketch">Open ChemSketch (drawing app on its own)</button>
</div>
<div class="menu" id="mLine" hidden>
  <button data-lh="1">1.0</button><button data-lh="1.15">1.15</button><button data-lh="1.5">1.5</button><button data-lh="2">2.0</button>
</div>
<div class="menu" id="mTable" hidden><div class="tgrid" id="tgrid"></div><div class="tglab" id="tglab">Insert table</div></div>
<div class="menu" id="mSym" hidden><div class="symg" id="symg"></div></div>

<div class="cdm" id="cdm" hidden>
  <div class="cdm-wait" id="cdmWait">Opening the drawing editor…</div>
  <iframe id="cdFrame" title="ChemSketch drawing editor"></iframe>
</div>

<div id="toast" hidden></div>
<input type="file" id="fileIn" accept=".json,.docx,.pdf,application/json,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
<input type="file" id="imgIn" accept="image/*" hidden>
<div id="exportHost" aria-hidden="true"></div>

<script src="js/vendor/fonts.js"></script>
<script src="js/vendor/docfonts.js"></script>
<script src="js/vendor/jspdf.umd.min.js"></script>
<script src="js/vendor/svg2pdf.umd.min.js"></script>
<script src="js/sketch/core.js"></script>
<script src="js/sketch/richtext.js"></script>
<script src="js/sketch/chem.js"></script>
<script src="js/sketch/apparatus.js"></script>
<script src="js/sketch/render.js"></script>
<script src="js/sketch/document.js"></script>
<script src="js/sketch/export.js"></script>
<script src="js/word/util.js"></script>
<script src="js/word/history.js"></script>
<script src="js/word/drawings.js"></script>
<script src="js/word/editor.js"></script>
<script src="js/word/formulas.js"></script>
<script src="js/word/pdf.js"></script>
<script src="js/word/docx.js"></script>
<script src="js/word/merge.js"></script>
<script src="js/word/main.js"></script>
</body>
</html>
